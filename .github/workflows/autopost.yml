name: Auto-post Shorts & TikTok

on:
  schedule:
    # Heures en UTC : 07:17, 12:17 et 18:17 (soit 9h17, 14h17, 20h17 heure de Paris en été).
    - cron: "17 7,12,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Générer sans publier"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer ffmpeg et les polices
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Générer et publier
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -m autoshorts.main ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Garder une copie des vidéos (7 jours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Enregistrer l'historique (évite les sujets en double)
        if: always()
        run: |
          git config user.name "autoshorts-bot"
          git config user.email "autoshorts-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "Historique : nouvelle vidéo" && git push)
